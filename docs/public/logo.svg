<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="arrow" x1="180" y1="140" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="pipe" x1="140" y1="140" x2="140" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- Subtle grid lines (blueprint aesthetic) -->
  <line x1="170" y1="80" x2="170" y2="432" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="192" x2="432" y2="192" stroke="#3B82F6" stroke-width="1" opacity="0.2"/>
  <line x1="80" y1="320" x2="432" y2="320" stroke="#3B82F6" stroke-width="1" opacity="0.2"/>
  <!-- Pipe "|" -->
  <rect x="128" y="136" width="36" height="240" rx="8" fill="url(#pipe)"/>
  <!-- Chevron ">" -->
  <path d="M 216 148 L 376 256 L 216 364" stroke="url(#arrow)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
