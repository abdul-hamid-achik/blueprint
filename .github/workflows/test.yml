name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: go build ./...

      - name: Test with race detection and coverage
        run: go test ./... -v -count=1 -race -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        run: |
          # Get overall coverage percentage
          COVERAGE=$(go tool cover -func=coverage.out | grep "total:" | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"

          # Per-package coverage thresholds
          echo ""
          echo "Per-package coverage:"
          go test ./... -cover 2>&1 | grep -E "coverage:|no test files" || true

          # Current overall threshold is 60% (will increase as we add more tests)
          # Individual package thresholds:
          # - internal/lexer: 85%
          # - internal/parser: 75%
          # - internal/checker: 80%
          # - internal/codegen/js: 75%
          THRESHOLD=60.0
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold of ${THRESHOLD}%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold of ${THRESHOLD}%"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Vet
        run: go vet ./...

      - name: Build binary
        run: go build -o bin/bp ./cmd/bp

      - name: Check all examples
        run: |
          ./bin/bp check examples/hello-world.bp
          ./bin/bp check examples/todo-api.bp
          ./bin/bp check examples/auth-service.bp
          ./bin/bp check examples/ecommerce-api.bp
          ./bin/bp check examples/realtime-chat.bp
          ./bin/bp check testdata/valid/all_features.bp

      - name: Build all examples
        run: |
          ./bin/bp build examples/hello-world.bp --out /tmp/hello
          ./bin/bp build examples/todo-api.bp --out /tmp/todo
          ./bin/bp build examples/auth-service.bp --out /tmp/auth
          ./bin/bp build examples/ecommerce-api.bp --out /tmp/ecommerce
          ./bin/bp build examples/realtime-chat.bp --out /tmp/chat
          ./bin/bp build testdata/valid/all_features.bp --out /tmp/full

      - name: Validate generated TypeScript
        run: |
          for dir in /tmp/hello /tmp/todo /tmp/auth /tmp/ecommerce /tmp/chat /tmp/full; do
            echo "=== Validating TypeScript in $dir ==="
            cd "$dir"
            # `--no-save` keeps package.json bp-generated; otherwise the
            # next step's `bp diff --exit-code` flags package.json as
            # modified (npm would have appended these to devDependencies).
            npm install --no-save typescript @types/node @types/pg
            npx tsc --noEmit --skipLibCheck
          done

      - name: Build idempotency check (bp diff --exit-code after build)
        # A fresh `bp build` followed immediately by `bp diff --exit-code` must
        # report no changes. Catches non-determinism in codegen (sort order,
        # map iteration, time-based output) before it ships.
        run: |
          for pair in "examples/hello-world.bp /tmp/hello" "examples/todo-api.bp /tmp/todo" "examples/auth-service.bp /tmp/auth" "examples/ecommerce-api.bp /tmp/ecommerce" "examples/realtime-chat.bp /tmp/chat"; do
            src="${pair% *}"; dir="${pair#* }"
            echo "=== Idempotency: $src -> $dir ==="
            ./bin/bp diff "$src" --out "$dir" --no-color --exit-code
          done

      - name: Generate Drizzle migrations on all examples
        # drizzle-kit is already in each generated package.json's devDeps and was
        # installed by the previous "Validate generated TypeScript" step. We just
        # need to invoke it. DATABASE_URL is required at config-load time but
        # `generate` only needs the schema, not a live database.
        run: |
          for dir in /tmp/todo /tmp/auth /tmp/ecommerce /tmp/chat /tmp/full; do
            if [ ! -f "$dir/drizzle.config.ts" ]; then
              echo "(skipping $dir — no drizzle.config.ts, spec has no models)"
              continue
            fi
            echo "=== drizzle-kit generate in $dir ==="
            cd "$dir"
            DATABASE_URL=postgresql://localhost/x npx drizzle-kit generate >/tmp/drizzle.log 2>&1 || (cat /tmp/drizzle.log; exit 1)
            ls drizzle/*.sql >/dev/null 2>&1 || (echo "no SQL migration emitted in $dir"; ls -la drizzle/; exit 1)
          done

      - name: Build with --target python (smoke)
        # hello-world is the smallest canonical Python target spec;
        # idempotency is enforced so generator non-determinism is caught here.
        run: |
          rm -rf /tmp/py-hello
          ./bin/bp build examples/hello-world.bp --out /tmp/py-hello --target python
          ./bin/bp diff examples/hello-world.bp --out /tmp/py-hello --target python --no-color --exit-code
          test -f /tmp/py-hello/pyproject.toml || (echo "missing pyproject.toml" && exit 1)
          test -f /tmp/py-hello/src/app.py || (echo "missing app.py" && exit 1)
          test -f /tmp/py-hello/src/routes/hello.py || (echo "missing hello route" && exit 1)
          python3 - <<'PY'
          import ast, os, sys
          err = 0
          for root, _, files in os.walk('/tmp/py-hello/src'):
              for f in files:
                  if not f.endswith('.py'):
                      continue
                  path = os.path.join(root, f)
                  try:
                      ast.parse(open(path).read(), filename=path)
                  except SyntaxError as e:
                      print(path, e)
                      err = 1
          sys.exit(err)
          PY
          echo "--target python output OK"

      - name: Build supported Python examples and enforce fail-closed behavior
        # Build every canonical example whose semantics the Python target can
        # currently preserve, AST-parse the emitted .py files, and enforce
        # idempotency. Canonical examples with semantics the target cannot yet
        # preserve must fail before any partial project is presented as valid.
        run: |
          for pair in "examples/hello-world.bp /tmp/py-hello-all" "examples/todo-api.bp /tmp/py-todo"; do
            src="${pair% *}"; dir="${pair#* }"
            echo "=== --target python: $src -> $dir ==="
            rm -rf "$dir"
            ./bin/bp build "$src" --out "$dir" --target python
            ./bin/bp diff "$src" --out "$dir" --target python --no-color --exit-code
            DIR="$dir" python3 - <<'PY'
          import ast, os, sys
          err = 0
          d = os.environ['DIR']
          for root, _, files in os.walk(d):
              for f in files:
                  if not f.endswith('.py'):
                      continue
                  path = os.path.join(root, f)
                  try:
                      ast.parse(open(path).read(), filename=path)
                  except SyntaxError as e:
                      print(path, e)
                      err = 1
          sys.exit(err)
          PY
          done
          if output=$(./bin/bp build examples/auth-service.bp --out /tmp/py-auth --target python 2>&1); then
            echo "auth-service unexpectedly built despite unsupported authored tests"
            exit 1
          fi
          echo "$output" | grep -q "authored tests and fixtures"
          if output=$(./bin/bp build examples/ecommerce-api.bp --out /tmp/py-ecommerce --target python 2>&1); then
            echo "ecommerce-api unexpectedly built despite unsupported named enum semantics"
            exit 1
          fi
          echo "$output" | grep -q 'named `enum` declarations'
          if output=$(./bin/bp build examples/realtime-chat.bp --out /tmp/py-chat --target python 2>&1); then
            echo "realtime-chat unexpectedly built despite unsupported STREAM/WS semantics"
            exit 1
          fi
          echo "$output" | grep -Eq '`STREAM` endpoints|`WS` endpoints'
          echo "Supported Python examples build + parse + idempotent; unsupported semantics fail closed"

      - name: Build and run the Effect health scaffold
        # The experimental target is intentionally narrow, but everything it
        # does emit must install, type-check, start, and answer its advertised
        # health endpoint. single_env.bp exercises typed scalar/list defaults.
        run: |
          rm -rf /tmp/effect-env
          ./bin/bp build testdata/valid/single_env.bp --out /tmp/effect-env --target effect
          ./bin/bp diff testdata/valid/single_env.bp --out /tmp/effect-env --target effect --no-color --exit-code
          cd /tmp/effect-env
          npm install
          npm run build
          npm start >/tmp/effect-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          if ! curl --retry 10 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:3000/health | grep -q '"target":"effect"'; then
            cat /tmp/effect-start.log
            exit 1
          fi
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Build and run generated Node contract and property tests
        # Exercise the full PGlite + fast-check path, including dependency
        # resolution and execution. Shape-only checks can miss invalid imports,
        # setup failures, runtime schema mismatches, and invalid arbitraries.
        run: |
          rm -rf /tmp/todo-gentests
          ./bin/bp build examples/todo-api.bp --out /tmp/todo-gentests --gen-property-tests
          test -f /tmp/todo-gentests/test/_harness/ddl.ts || (echo "missing ddl.ts" && exit 1)
          test -f /tmp/todo-gentests/test/_harness/db.ts || (echo "missing db.ts" && exit 1)
          test -f /tmp/todo-gentests/test/_harness/setup.ts || (echo "missing setup.ts" && exit 1)
          test -f /tmp/todo-gentests/vitest.config.ts || (echo "missing vitest.config.ts" && exit 1)
          test -f /tmp/todo-gentests/test/generated/todos.test.ts || (echo "missing generated test" && exit 1)
          test -f /tmp/todo-gentests/test/generated/todos.property.test.ts || (echo "missing generated property test" && exit 1)
          cd /tmp/todo-gentests
          npm install
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high
          npm test
          echo "generated contract + property tests execute successfully"

      - name: Build with --target python --gen-tests (Phase 4 smoke)
        # Python Phase 4 emits a pytest contract suite backed by
        # testcontainers[postgresql]. We don't run pytest here (Docker isn't
        # guaranteed in every CI environment), but we assert the harness +
        # per-resource test files exist, syntax-check every emitted .py, and
        # require idempotency via bp diff --exit-code.
        run: |
          rm -rf /tmp/py-hello-gt
          ./bin/bp build examples/hello-world.bp --out /tmp/py-hello-gt --target python --gen-tests
          ./bin/bp diff examples/hello-world.bp --out /tmp/py-hello-gt --target python --gen-tests --no-color --exit-code
          test -f /tmp/py-hello-gt/tests/conftest.py || (echo "missing conftest.py" && exit 1)
          test -f /tmp/py-hello-gt/tests/test_hello.py || (echo "missing tests/test_hello.py" && exit 1)
          grep -q "testcontainers" /tmp/py-hello-gt/pyproject.toml || (echo "testcontainers dep missing" && exit 1)
          python3 - <<'PY'
          import ast, os, sys
          err = 0
          for root, _, files in os.walk('/tmp/py-hello-gt/tests'):
              for f in files:
                  if not f.endswith('.py'):
                      continue
                  path = os.path.join(root, f)
                  try:
                      ast.parse(open(path).read(), filename=path)
                  except SyntaxError as e:
                      print(path, e)
                      err = 1
          sys.exit(err)
          PY
          echo "--target python --gen-tests output OK"

      - name: Lint examples
        run: |
          ./bin/bp lint examples/hello-world.bp
          ./bin/bp lint examples/todo-api.bp

      - name: Format check examples
        run: |
          for f in examples/*.bp; do
            ./bin/bp fmt "$f" --check
          done

      - name: Generate docs
        run: |
          ./bin/bp docs examples/hello-world.bp --out /tmp/hello-openapi.json
          ./bin/bp docs examples/todo-api.bp --out /tmp/todo-openapi.json

  tooling:
    name: Runtime, docs, and editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/runtime/package-lock.json
            editors/vscode-blueprint/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Build and test @blueprint/runtime
        working-directory: packages/runtime
        run: |
          npm ci
          npm test
          npm pack --dry-run

      - name: Test VS Code extension
        working-directory: editors/vscode-blueprint
        run: |
          npm ci
          npm run check

      - name: Build documentation website
        working-directory: docs
        run: |
          bun install --frozen-lockfile
          bun run docs:build
